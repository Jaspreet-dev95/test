name: Keep CP24 first in IPTV playlist

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update.yml
      - build_playlist.py
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate channel playlist from IPTV-org
        run: python3 build_playlist.py
      - name: Commit updated playlist
        run: |
          git add cp24-first.m3u
          if git diff --cached --quiet; then
            echo "Playlist already up to date"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Refresh playlist with CP24 first"
          git push
